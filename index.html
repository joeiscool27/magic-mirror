<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mirror</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,400;1,600&family=Space+Grotesk:wght@300;400;500;600;700&family=Roboto+Mono:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="mirror">

  <!-- TOP LEFT: Clock -->
  <div class="top-left module">
    <div class="clock-time">
      <span id="clock-hm">--:--</span><span class="clock-ampm" id="clock-ampm"></span>
    </div>
    <div class="clock-date" id="clock-date"></div>
    <div class="clock-week" id="clock-week"></div>
    <!-- EA horizontal logo — add logo.png to repo to enable -->
    <img class="ea-logo" src="logo.png" alt="" onerror="this.style.display='none'">
  </div>

  <!-- TOP CENTER: Dynamic Sports Grid (2x2) -->
  <div class="top-center module">
    <div class="sports-grid">

      <!-- Eagles (NFL) -->
      <div class="sports-card eagles-card" id="eagles-card">
        <div class="sports-card-header">
          <span class="sports-team-abbr">Eagles</span>
        </div>
        <div class="sports-card-content" id="eagles"></div>
      </div>

      <!-- Sixers (NBA) -->
      <div class="sports-card sixers-card" id="sixers-card">
        <div class="sports-card-header">
          <span class="sports-team-abbr">Sixers</span>
        </div>
        <div class="sports-card-content" id="sixers"></div>
      </div>

      <!-- Phillies (MLB) -->
      <div class="sports-card phillies-card" id="phillies-card">
        <div class="sports-card-header">
          <span class="sports-team-abbr">Phillies</span>
        </div>
        <div class="sports-card-content" id="phillies"></div>
      </div>

      <!-- Union (MLS) -->
      <div class="sports-card union-card" id="union-card">
        <div class="sports-card-header">
          <span class="sports-team-abbr">Union</span>
        </div>
        <div class="sports-card-content" id="union"></div>
      </div>

    </div>
  </div>

  <!-- TOP RIGHT: Weather -->
  <div class="top-right module">
    <div class="module-header">Philadelphia</div>
    <div class="weather-icon"  id="weather-icon">—</div>
    <div class="weather-temp"  id="weather-temp">--°</div>
    <div class="weather-desc"  id="weather-desc"></div>
    <div class="weather-feels" id="weather-feels"></div>
    <div class="module-header" style="margin-top:20px;">Forecast</div>
    <div id="forecast"></div>
  </div>

  <!-- MID CENTER: Compliment + EA crest watermark -->
  <div class="mid-center module">
    <div class="crest-wrap">
      <img class="crest-img" src="crest.png" alt="" onerror="this.style.display='none'">
      <div class="pull-quote">
        <div class="pull-rule"></div>
        <div class="compliment" id="compliment"></div>
        <div class="pull-rule"></div>
      </div>
    </div>
  </div>

  <!-- BOT LEFT: Calendar -->
  <div class="bot-left module">
    <div class="module-header">EA Events</div>
    <div id="calendar"></div>
  </div>

  <!-- BOT RIGHT: News -->
  <div class="bot-right module">
    <div class="module-header" style="text-align:right;">News</div>
    <div id="news"></div>
  </div>

</div>
<script src="app.js"></script>
</body>
</html>
