<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mirror</title>
  <link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,300;0,400;0,700;1,300&family=Roboto+Mono:wght@300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #fafafa;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: 'Raleway', sans-serif;
      color: #1a1a1a;
      -webkit-font-smoothing: antialiased;
    }

    .mirror {
      display: grid;
      grid-template-columns: 300px 1fr 360px;
      grid-template-rows: auto 1fr auto;
      height: 100vh;
      padding: 40px;
      gap: 0 20px;
    }

    .top-left   { grid-column: 1; grid-row: 1; }
    .top-center { grid-column: 2; grid-row: 1; display: flex; flex-direction: column; align-items: center; }
    .top-right  { grid-column: 3; grid-row: 1; text-align: right; }
    .mid-center { grid-column: 2; grid-row: 2; display: flex; align-items: center; justify-content: center; }
    .bot-left   { grid-column: 1; grid-row: 3; }
    .bot-right  { grid-column: 3; grid-row: 3; text-align: right; }

    /* ── Module header ─────────────────────────── */
    .module-header {
      color: #8b6e3d;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 5px;
      text-transform: uppercase;
      border-bottom: 1px solid rgba(139,110,61,0.4);
      padding-bottom: 5px;
      margin-bottom: 10px;
    }

    /* ── Clock ─────────────────────────────────── */
    .clock-time {
      font-family: 'Roboto Mono', monospace;
      font-size: 56px;
      font-weight: 300;
      letter-spacing: 2px;
      color: #1a1a1a;
      line-height: 1;
      white-space: nowrap;
    }
    .clock-ampm {
      font-family: 'Roboto Mono', monospace;
      font-size: 22px;
      font-weight: 300;
      color: #aaa;
      letter-spacing: 2px;
      margin-left: 6px;
      vertical-align: middle;
    }
    .clock-date {
      font-size: 14px;
      font-weight: 300;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #777;
      margin-top: 8px;
    }
    .clock-week {
      font-size: 11px;
      font-weight: 300;
      letter-spacing: 3px;
      color: #aaa;
      text-transform: uppercase;
      margin-top: 3px;
    }

    /* ── Weather ───────────────────────────────── */
    .weather-icon  { font-size: 48px; line-height: 1; }
    .weather-temp  { font-size: 28px; font-weight: 400; color: #1a1a1a; margin-top: 4px; }
    .weather-desc  {
      font-size: 11px; color: #777; font-weight: 300;
      text-transform: uppercase; letter-spacing: 2px; margin-top: 2px;
    }
    .weather-feels { font-size: 12px; color: #999; margin-top: 2px; }

    .forecast-row {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      color: #1a1a1a;
      padding: 3px 0;
      font-weight: 300;
    }
    .forecast-day  { width: 80px; color: #777; text-align: left; }
    .forecast-icon { width: 24px; text-align: center; }
    .forecast-temp { width: 46px; text-align: right; }

    /* ── Phillies ──────────────────────────────── */
    .phillies-header {
      width: 100%;
      text-align: center;
    }
    .phillies-matchup {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      margin: 10px 0 6px;
    }
    .phillies-team {
      text-align: center;
      min-width: 60px;
    }
    .phillies-abbr {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 3px;
      color: #999;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .phillies-score {
      font-family: 'Roboto Mono', monospace;
      font-size: 44px;
      font-weight: 300;
      line-height: 1;
      color: #1a1a1a;
    }
    .phillies-score.win  { color: #b4001e; }
    .phillies-score.loss { color: #ccc; }
    .phillies-sep {
      font-size: 28px;
      color: #ddd;
      font-weight: 300;
      padding-bottom: 2px;
    }
    .phillies-status {
      font-size: 10px;
      color: #aaa;
      letter-spacing: 3px;
      text-transform: uppercase;
      text-align: center;
    }
    .phillies-record {
      font-size: 12px;
      color: #8b6e3d;
      letter-spacing: 2px;
      text-align: center;
      margin-top: 5px;
      font-weight: 300;
    }
    .phillies-next {
      font-size: 12px;
      color: #999;
      letter-spacing: 1px;
      text-align: center;
      margin-top: 8px;
      font-weight: 300;
    }
    .phillies-upcoming {
      text-align: center;
      margin: 10px 0 6px;
    }
    .phillies-upcoming-teams {
      font-size: 18px;
      font-weight: 400;
      letter-spacing: 3px;
      color: #1a1a1a;
      margin-bottom: 4px;
    }
    .phillies-upcoming-time {
      font-size: 12px;
      color: #777;
      letter-spacing: 1px;
    }

    /* ── Compliment ────────────────────────────── */
    .compliment {
      font-size: 32px;
      font-weight: 300;
      font-style: italic;
      color: #1a1a1a;
      letter-spacing: 1px;
      text-align: center;
      line-height: 1.3;
      text-shadow: 0 0 40px rgba(139,110,61,0.15);
      transition: opacity 1s ease;
    }

    /* ── Calendar ──────────────────────────────── */
    .cal-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 5px 0;
      border-bottom: 1px solid rgba(0,0,0,0.06);
    }
    .cal-title { font-size: 14px; font-weight: 400; color: #333; flex: 1; padding-right: 10px; }
    .cal-date  { font-size: 12px; color: #8b6e3d; font-weight: 300; white-space: nowrap; }

    /* ── News ──────────────────────────────────── */
    .news-item {
      border-right: 2px solid rgba(139,110,61,0.3);
      padding-right: 14px;
      margin-bottom: 16px;
    }
    .news-title  { font-size: 14px; font-weight: 400; color: #1a1a1a; line-height: 1.45; }
    .news-source {
      font-size: 10px; color: #aaa; letter-spacing: 2px;
      text-transform: uppercase; margin-top: 4px;
    }

    /* ── Fade in ───────────────────────────────── */
    .module { animation: fadeInUp 0.8s ease both; }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
<div class="mirror">

  <!-- TOP LEFT: Clock -->
  <div class="top-left module">
    <div class="clock-time">
      <span id="clock-hm">--:--</span><span class="clock-ampm" id="clock-ampm"></span>
    </div>
    <div class="clock-date" id="clock-date"></div>
    <div class="clock-week" id="clock-week"></div>
  </div>

  <!-- TOP CENTER: Phillies -->
  <div class="top-center module">
    <div class="module-header phillies-header">Phillies</div>
    <div id="phillies"></div>
  </div>

  <!-- TOP RIGHT: Weather -->
  <div class="top-right module">
    <div class="module-header">Philadelphia</div>
    <div class="weather-icon"  id="weather-icon">—</div>
    <div class="weather-temp"  id="weather-temp">--°</div>
    <div class="weather-desc"  id="weather-desc"></div>
    <div class="weather-feels" id="weather-feels"></div>
    <div class="module-header" style="margin-top:18px;">Forecast</div>
    <div id="forecast"></div>
  </div>

  <!-- MID CENTER: Compliment -->
  <div class="mid-center module">
    <div class="compliment" id="compliment"></div>
  </div>

  <!-- BOT LEFT: Calendar -->
  <div class="bot-left module">
    <div class="module-header">EA Events</div>
    <div id="calendar"></div>
  </div>

  <!-- BOT RIGHT: News -->
  <div class="bot-right module">
    <div class="module-header">News</div>
    <div id="news"></div>
  </div>

</div>
<script>
// ── CONFIG ───────────────────────────────────────────────────
const CONFIG = {
  lat: 39.9526,
  lon: -75.1652,
  timezone: 'America/New_York',

  events: [
    { title: 'EA: Memorial Day (Holiday)', date: 'May 25' },
    { title: 'EA: Faculty Dev & Closing',  date: 'Jun 8'  },
    { title: 'EA: Commencement',           date: 'Jun 11' },
  ],

  compliments: [
    "You're doing great.",
    "Stay curious.",
    "Make today count.",
    "Keep building.",
    "One step at a time.",
    "You've got this.",
    "Make it happen.",
    "Sharp mind, sharp work.",
  ],

  newsFeeds: [
    { name: 'BBC',   url: 'https://feeds.bbci.co.uk/news/rss.xml' },
    { name: 'ESPN',  url: 'https://www.espn.com/espn/rss/news'    },
  ],
};

// ── WMO code → emoji + label ─────────────────────────────────
function wmoInfo(code) {
  if (code === 0)  return { icon: '☀️',  label: 'Clear' };
  if (code <= 2)   return { icon: '🌤️',  label: 'Partly Cloudy' };
  if (code === 3)  return { icon: '☁️',  label: 'Overcast' };
  if (code <= 48)  return { icon: '🌫️',  label: 'Fog' };
  if (code <= 57)  return { icon: '🌦️',  label: 'Drizzle' };
  if (code <= 67)  return { icon: '🌧️',  label: 'Rain' };
  if (code <= 77)  return { icon: '❄️',  label: 'Snow' };
  if (code <= 82)  return { icon: '🌦️',  label: 'Showers' };
  if (code <= 99)  return { icon: '⛈️',  label: 'Thunderstorm' };
  return { icon: '🌡️', label: 'Unknown' };
}

// ── Clock ─────────────────────────────────────────────────────
function updateClock() {
  const now  = new Date();
  let h      = now.getHours();
  const m    = String(now.getMinutes()).padStart(2, '0');
  const ampm = h >= 12 ? 'pm' : 'am';
  h = h % 12 || 12;

  const DAYS   = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const MONTHS = ['January','February','March','April','May','June',
                  'July','August','September','October','November','December'];
  const startOfYear = new Date(now.getFullYear(), 0, 1);
  const week = Math.ceil(((now - startOfYear) / 86400000 + startOfYear.getDay() + 1) / 7);

  document.getElementById('clock-hm').textContent   = `${h}:${m}`;
  document.getElementById('clock-ampm').textContent  = ampm;
  document.getElementById('clock-date').textContent  =
    `${DAYS[now.getDay()]}, ${MONTHS[now.getMonth()]} ${now.getDate()}`;
  document.getElementById('clock-week').textContent  = `Week ${week}`;
}
setInterval(updateClock, 1000);
updateClock();

// ── Weather — Open-Meteo (free, no API key) ───────────────────
async function loadWeather() {
  try {
    const url = `https://api.open-meteo.com/v1/forecast`
      + `?latitude=${CONFIG.lat}&longitude=${CONFIG.lon}`
      + `&current=temperature_2m,apparent_temperature,weather_code`
      + `&daily=weather_code,temperature_2m_max,temperature_2m_min`
      + `&temperature_unit=fahrenheit`
      + `&timezone=${CONFIG.timezone}`
      + `&forecast_days=5`;

    const data  = await fetch(url).then(r => r.json());
    const cur   = data.current;
    const daily = data.daily;
    const { icon, label } = wmoInfo(cur.weather_code);

    document.getElementById('weather-icon').textContent  = icon;
    document.getElementById('weather-temp').textContent  = `${Math.round(cur.temperature_2m)}°F`;
    document.getElementById('weather-desc').textContent  = label;
    document.getElementById('weather-feels').textContent = `Feels like ${Math.round(cur.apparent_temperature)}°`;

    document.getElementById('forecast').innerHTML = daily.time.map((t, i) => {
      const d   = new Date(t + 'T12:00:00');
      const day = i === 0 ? 'Today' : i === 1 ? 'Tomorrow'
                : d.toLocaleDateString('en-US', { weekday: 'short' });
      const { icon: fi } = wmoInfo(daily.weather_code[i]);
      const hi  = Math.round(daily.temperature_2m_max[i]);
      return `<div class="forecast-row">
        <span class="forecast-day">${day}</span>
        <span class="forecast-icon">${fi}</span>
        <span class="forecast-temp">${hi}°</span>
      </div>`;
    }).join('');
  } catch (e) {
    console.error('Weather error:', e);
  }
}
loadWeather();
setInterval(loadWeather, 10 * 60 * 1000);

// ── Phillies — MLB Stats API (free, no key) ───────────────────
async function loadPhillies() {
  try {
    const today = new Date();
    const fmt   = d => d.toISOString().slice(0, 10);
    const past  = new Date(today); past.setDate(past.getDate() - 3);
    const ahead = new Date(today); ahead.setDate(ahead.getDate() + 3);

    const url = `https://statsapi.mlb.com/api/v1/schedule?sportId=1&teamId=143`
      + `&startDate=${fmt(past)}&endDate=${fmt(ahead)}&hydrate=linescore`;

    const data      = await fetch(url).then(r => r.json());
    const allDates  = data.dates || [];
    const allGames  = allDates.flatMap(d => d.games.map(g => ({ ...g, dateStr: d.date })));

    const todayStr     = fmt(today);
    const todayGames   = allGames.filter(g => g.dateStr === todayStr);
    const pastGames    = allGames.filter(g => g.dateStr < todayStr).reverse();
    const futureGames  = allGames.filter(g => g.dateStr > todayStr);

    const display  = todayGames[0] || pastGames[0];
    const nextGame = futureGames[0];
    const el       = document.getElementById('phillies');

    if (!display && !nextGame) {
      el.innerHTML = '<div class="phillies-status">No games found</div>';
      return;
    }

    if (!display && nextGame) {
      const opp      = nextGame.teams?.home?.team?.id === 143 ? nextGame.teams?.away : nextGame.teams?.home;
      const oppAbbr  = opp?.team?.abbreviation || '???';
      const gameTime = nextGame.gameDate
        ? new Date(nextGame.gameDate).toLocaleString('en-US',
            { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit', timeZone: CONFIG.timezone })
        : '';
      el.innerHTML = `
        <div class="phillies-upcoming">
          <div class="phillies-upcoming-teams">PHI vs ${oppAbbr}</div>
          <div class="phillies-upcoming-time">${gameTime}</div>
        </div>`;
      return;
    }

    const status    = display.status?.detailedState || '';
    const isLive    = status === 'In Progress';
    const isFinal   = status.includes('Final') || status.includes('Game Over');
    const isPreview = status === 'Preview' || status === 'Scheduled';

    const home     = display.teams?.home;
    const away     = display.teams?.away;
    const phi      = home?.team?.id === 143 ? home : away;
    const opp      = home?.team?.id === 143 ? away : home;

    const phiScore = phi?.score ?? '–';
    const oppScore = opp?.score ?? '–';
    const oppAbbr  = opp?.team?.abbreviation || opp?.team?.name?.slice(0, 3).toUpperCase() || '???';
    const record   = phi?.leagueRecord ? `${phi.leagueRecord.wins}–${phi.leagueRecord.losses}` : '';

    const phiWin   = isFinal && Number(phiScore) > Number(oppScore);
    const phiLoss  = isFinal && Number(phiScore) < Number(oppScore);
    const phiClass = phiWin ? 'win' : phiLoss ? 'loss' : '';

    const inning   = display.linescore?.currentInning || '';
    const half     = display.linescore?.inningHalf || '';
    const liveStr  = inning ? `${half === 'Top' ? '▲' : '▼'} ${inning}` : 'Live';

    let statusLine = isFinal ? 'Final' : isLive ? liveStr : isPreview ? 'Today' : status;
    if (isPreview && display.gameDate) {
      const t = new Date(display.gameDate).toLocaleTimeString('en-US',
        { hour: 'numeric', minute: '2-digit', timeZone: CONFIG.timezone });
      statusLine = `Today · ${t}`;
    }

    let html = `
      <div class="phillies-matchup">
        <div class="phillies-team">
          <div class="phillies-abbr">PHI</div>
          <div class="phillies-score ${phiClass}">${phiScore}</div>
        </div>
        <div class="phillies-sep">·</div>
        <div class="phillies-team">
          <div class="phillies-abbr">${oppAbbr}</div>
          <div class="phillies-score">${oppScore}</div>
        </div>
      </div>
      <div class="phillies-status">${statusLine}</div>
      ${record ? `<div class="phillies-record">${record}</div>` : ''}`;

    if (!todayGames.length && nextGame) {
      const nextOpp  = nextGame.teams?.home?.team?.id === 143 ? nextGame.teams?.away : nextGame.teams?.home;
      const nextAbbr = nextOpp?.team?.abbreviation || '???';
      const nextDate = nextGame.gameDate
        ? new Date(nextGame.gameDate).toLocaleDateString('en-US',
            { weekday: 'short', month: 'short', day: 'numeric', timeZone: CONFIG.timezone })
        : '';
      html += `<div class="phillies-next">Next: vs ${nextAbbr} · ${nextDate}</div>`;
    }

    el.innerHTML = html;
  } catch (e) {
    console.error('Phillies error:', e);
    document.getElementById('phillies').innerHTML = '<div class="phillies-status">—</div>';
  }
}
loadPhillies();
setInterval(loadPhillies, 5 * 60 * 1000);

// ── Compliments ───────────────────────────────────────────────
function updateCompliment() {
  const el = document.getElementById('compliment');
  el.style.opacity = 0;
  setTimeout(() => {
    const list = CONFIG.compliments;
    el.textContent = list[Math.floor(Math.random() * list.length)];
    el.style.opacity = 1;
  }, 1000);
}
updateCompliment();
setInterval(updateCompliment, 30 * 1000);

// ── Calendar ──────────────────────────────────────────────────
document.getElementById('calendar').innerHTML = CONFIG.events.map(e => `
  <div class="cal-row">
    <span class="cal-title">${e.title}</span>
    <span class="cal-date">${e.date}</span>
  </div>`).join('');

// ── News — via allorigins CORS proxy ──────────────────────────
async function loadNews() {
  const items = [];
  for (const feed of CONFIG.newsFeeds) {
    try {
      const proxy = `https://api.allorigins.win/get?url=${encodeURIComponent(feed.url)}`;
      const data  = await fetch(proxy).then(r => r.json());
      const xml   = new DOMParser().parseFromString(data.contents, 'text/xml');
      xml.querySelectorAll('item').forEach((item, i) => {
        if (i < 2) items.push({
          title:  item.querySelector('title')?.textContent || '',
          source: feed.name,
        });
      });
    } catch (e) {
      console.error(`News error (${feed.name}):`, e);
    }
  }
  document.getElementById('news').innerHTML = items.map(item => `
    <div class="news-item">
      <div class="news-title">${item.title}</div>
      <div class="news-source">${item.source}</div>
    </div>`).join('');
}
loadNews();
setInterval(loadNews, 15 * 60 * 1000);

// ── Auto-reload every 5 min (picks up GitHub Pages deploys) ───
setInterval(() => location.reload(), 5 * 60 * 1000);
</script>
</body>
</html>
